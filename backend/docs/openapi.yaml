openapi: 3.1.0
info:
  title: ZERO TABLE 공공데이터 API
  description: "SQLite 수집 데이터 조회, 공공 API 프록시, 창업 설문 점수 계산을 제공합니다. 인증 불필요. 평가는 초기 설\
    계 규칙이며 자료 부족 시 총점을 보류합니다. 상권영역 좌표는 EPSG:5181이며 위경도가 아닙니다. 서울시·부동산원·소상공인시장진흥공단\
    \ 출처를 표시하세요."
  version: 0.1.0
servers:
- url: /
  description: 현재 서버
- url: https://webframework.monithub.org
  description: 운영
tags:
- name: 창업 계획 평가
  description: "설문과 저장된 상권 자료를 비교해 점수, 참고 지표, 영업시간 대안을 제공합니다."
- name: 공공데이터
  description: 인증 없이 공개 조회합니다. 원본 API 키는 서버에서 주입합니다.
paths:
  /api/v1/assessments:
    post:
      tags:
      - 창업 계획 평가
      summary: 창업 설문 점수 계산
      description: "1·2·5번은 선택형, 3·4번은 숫자 입력입니다. 미정은 null 또는 UNDECIDED로 보냅니다. 미정·자\
        료 누락·기준 협의 중인 항목은 보류합니다. 전체 평가 전 totalScore는 null입니다."
      operationId: assess
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentRequest"
            example:
              quarter: "20262"
              districtCode: "3111083"
              industryCode: CS100010
              customer:
                type: WORKER
                ageGroup: TWENTIES
                visitPurpose: WORK_SCHOOL
              schedule:
                businessDays: WEEKDAYS
                mainTime: DINNER
                canAdjustHours: true
              demand:
                targetMonthlySales: 20000000
                monthlyOperatingDays: 24
                expectedDailyTeams: 18
              strategy:
                menuPrice: 12000
                areaPyeong: 10
                seatCount: 15
                tableCount: 5
                dailyTurns: 3
                startupCapital: 50000000
                monthlyCapital: 3000000
              readiness:
                experience: EMPLOYEE
                participation: FULL_TIME
        required: true
      responses:
        "200":
          description: 계산 결과. 자료가 없어도 정상 부분 결과를 반환합니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResult"
        "400":
          description: 선택지·숫자 범위·JSON 형식 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/proxy/{dataset}:
    get:
      tags:
      - 공공데이터
      summary: 원본 API 프록시
      description: "허용된 데이터셋만 호출합니다. page/size는 공통 페이징이며 추가 쿼리는 데이터셋 parameters에 명\
        시된 원본 파라미터만 허용합니다. 예: ?page=1&size=100&quarter=20262. 부동산원 데이터: ?STATBL_ID=A_2024_00900&DTACYCLE_CD=YY&WRTTIME_IDTFR_ID=2025.\
        \ 응답은 10분 캐시하며 실제 외부 호출은 서버 전체 분당 60회로 제한합니다."
      operationId: proxy
      parameters:
      - name: dataset
        in: path
        required: true
        schema:
          type: string
        example: seoul_estimated_sales
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          maximum: 100000
          minimum: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 100
          maximum: 1000
          minimum: 1
      - name: quarter
        in: query
        description: "서울시 지원 데이터셋의 기준 분기. 예: 20262 (상주인구/상권영역 제외)"
      - name: STATBL_ID
        in: query
        description: "부동산원 통계표 ID. 예: A_2024_00900"
      - name: DTACYCLE_CD
        in: query
        description: "부동산원 수록주기. 예: YY"
      - name: WRTTIME_IDTFR_ID
        in: query
        description: "부동산원 기준시점. 예: 2025"
      - name: START_WRTTIME
        in: query
        description: 부동산원 시작시점
      - name: END_WRTTIME
        in: query
        description: 부동산원 종료시점
      - name: CLS_ID
        in: query
        description: 부동산원 지역/분류 ID
      - name: ITM_ID
        in: query
        description: 부동산원 항목 ID
      - name: GRP_ID
        in: query
        description: 부동산원 그룹 ID
      - name: STATBL_NM
        in: query
        description: 부동산원 통계표명 검색
      - name: divId
        in: query
        description: 소상공인 지역 구분(ctprvnCd/signguCd/adongCd). 기본 ctprvnCd
      - name: key
        in: query
        description: 소상공인 지역 코드(서버 인증키와 별개). 기본 11
      - name: indsLclsCd
        in: query
        description: 소상공인 업종 대분류
      - name: indsMclsCd
        in: query
        description: 소상공인 업종 중분류
      - name: indsSclsCd
        in: query
        description: 소상공인 업종 소분류
      responses:
        "429":
          description: 원본 호출 한도 초과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: 제공기관 API 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: 서버 원본 API 키 미설정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: 정상 응답
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "400":
          description: 요청 형식 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 데이터셋 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/datasets:
    get:
      tags:
      - 공공데이터
      summary: 데이터 목록·원본 필드·수집 현황
      description: 키 설정 여부는 유효성 검증 결과가 아닙니다. 실제 성공/실패는 collection-runs에서 확인합니다.
      operationId: datasets
      responses:
        "200":
          description: 정상 응답
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatasetView"
        "400":
          description: 요청 형식 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 데이터셋 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/datasets/{dataset}:
    get:
      tags:
      - 공공데이터
      summary: 데이터셋 상세·필드 사전
      operationId: dataset
      parameters:
      - name: dataset
        in: path
        required: true
        schema:
          type: string
        example: seoul_estimated_sales
      responses:
        "200":
          description: 정상 응답
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetView"
        "400":
          description: 요청 형식 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 데이터셋 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/datasets/{dataset}/records:
    get:
      tags:
      - 공공데이터
      summary: SQLite 수집 데이터 조회
      description: items에는 제공기관 원본 필드명과 값이 보존됩니다. total=0이면 수집 이력도 확인하세요. quarter·districtCode·industryCode로
        서울시 자료를 연결합니다.
      operationId: records
      parameters:
      - name: dataset
        in: path
        required: true
        schema:
          type: string
        example: seoul_estimated_sales
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          maximum: 100000
          minimum: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 100
          maximum: 1000
          minimum: 1
      - name: quarter
        in: query
        description: "기준 분기. 예: 20262"
        required: false
        schema:
          type: string
          pattern: "20\\d{2}[1-4]"
      - name: districtCode
        in: query
        description: "서울시 TRDAR_CD. 예: 3111083"
        required: false
        schema:
          type: string
      - name: industryCode
        in: query
        description: "서울시 SVC_INDUTY_CD 또는 소상공인 indsSclsCd. 예: CS100010"
        required: false
        schema:
          type: string
      - name: regionCode
        in: query
        description: "상권영역/개별 점포의 자치구 코드. 예: 11680"
        required: false
        schema:
          type: string
      - name: tableId
        in: query
        description: "부동산원 STATBL_ID. 예: A_2024_00900"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: 정상 응답
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "400":
          description: 요청 형식 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 데이터셋 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/collection-runs:
    get:
      tags:
      - 공공데이터
      summary: 최근 수집 이력
      description: "COMPLETE: 요청 범위 전체 수집, PARTIAL: maxPages까지 저장(다음은 nextPage), FAILED/INTERRUPTED:\
        \ 실패 전 페이지는 보존. processed는 갱신 포함 처리 건수이며 고유 저장 건수는 datasets를 확인합니다. 수집 실행은\
        \ 운영자 CLI로 수행합니다."
      operationId: runs
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: 정상 응답
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Run"
        "400":
          description: 요청 형식 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 데이터셋 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/assessments/rules:
    get:
      tags:
      - 창업 계획 평가
      summary: 100점 배점과 계산 규칙
      description: 세부 배점과 초안 산식을 제공합니다. 최대 56점분을 계산할 수 있습니다.
      operationId: rules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSet"
components:
  schemas:
    AssessmentRequest:
      type: object
      description: "1·2·5번은 선택형, 3·4번은 숫자 입력입니다. null 또는 UNDECIDED는 미정입니다. 상권의 업종\
        \ 매출은 같은 분기·상권 유형·업종과 비교하고, 인구는 같은 분기·상권 유형과 비교합니다."
      properties:
        quarter:
          type: string
          example: "20262"
          minLength: 1
          pattern: "20\\d{2}[1-4]"
        districtCode:
          type: string
          example: "3111083"
          minLength: 1
          pattern: "\\d{7}"
        industryCode:
          type: string
          example: CS100010
          minLength: 1
          pattern: "CS\\d{6}"
        customer:
          $ref: "#/components/schemas/Customer"
        schedule:
          $ref: "#/components/schemas/Schedule"
        demand:
          $ref: "#/components/schemas/Demand"
        strategy:
          $ref: "#/components/schemas/Strategy"
        readiness:
          $ref: "#/components/schemas/Readiness"
      required:
      - districtCode
      - industryCode
      - quarter
    Customer:
      type: object
      properties:
        type:
          type: string
          enum:
          - WORKER
          - STUDENT
          - RESIDENT
          - TOURIST
          - UNDECIDED
          example: WORKER
        ageGroup:
          type: string
          description: FIFTY_PLUS는 50대와 60대 이상을 합산합니다.
          enum:
          - TEENS
          - TWENTIES
          - THIRTIES
          - FORTIES
          - FIFTY_PLUS
          - UNDECIDED
          example: TWENTIES
        visitPurpose:
          type: string
          enum:
          - PASSING_BY
          - WORK_SCHOOL
          - REGULAR_LOCAL
          - DESTINATION
          - UNDECIDED
          example: WORK_SCHOOL
    Demand:
      type: object
      properties:
        targetMonthlySales:
          type: integer
          format: int64
          description: "목표 월 매출, 원. 미정은 null."
          example: 20000000
          maximum: 1000000000000
          minimum: 1
        monthlyOperatingDays:
          type: integer
          format: int32
          description: 월 영업일 수
          example: 24
          maximum: 31
          minimum: 1
        expectedDailyTeams:
          type: integer
          format: int32
          description: 하루 예상 방문 팀 수
          example: 18
          maximum: 100000
          minimum: 1
    Readiness:
      type: object
      properties:
        experience:
          type: string
          enum:
          - NONE
          - EMPLOYEE
          - MANAGER
          - OWNER
          - UNDECIDED
          example: EMPLOYEE
        participation:
          type: string
          enum:
          - FULL_TIME
          - THREE_FOUR_DAYS
          - WEEKENDS
          - UNDECIDED
          example: FULL_TIME
    Schedule:
      type: object
      properties:
        businessDays:
          type: string
          enum:
          - WEEKDAYS
          - WEEKENDS
          - ALL
          - UNDECIDED
          example: WEEKDAYS
        mainTime:
          type: string
          description: "오전 06~11, 점심 11~14, 오후 14~17, 저녁 17~21, 심야 21~06시"
          enum:
          - MORNING
          - LUNCH
          - AFTERNOON
          - DINNER
          - LATE_NIGHT
          - UNDECIDED
          example: LUNCH
        canAdjustHours:
          type: boolean
          description: 영업시간 조정 가능 여부. 가능으로 답했을 때 매출이 더 높은 시간대를 안내합니다.
          example: true
    Strategy:
      type: object
      properties:
        menuPrice:
          type: integer
          format: int64
          description: "대표 메뉴 1개 가격, 원. 객단가와 다릅니다."
          example: 12000
          maximum: 1000000000
          minimum: 1
        areaPyeong:
          type: number
          description: "예상 면적, 평"
          example: 10
          maximum: 10000
          minimum: 0.1
        seatCount:
          type: integer
          format: int32
          example: 15
          maximum: 10000
          minimum: 1
        tableCount:
          type: integer
          format: int32
          example: 5
          maximum: 10000
          minimum: 1
        dailyTurns:
          type: number
          description: 예상 하루 테이블 회전 수
          example: 3
          maximum: 100
          minimum: 0.1
        startupCapital:
          type: integer
          format: int64
          description: "사용 가능한 초기 자본, 원. 비용이 아닙니다."
          example: 50000000
          maximum: 1000000000000
          minimum: 0
        monthlyCapital:
          type: integer
          format: int64
          description: "사용 가능한 월 운영자금, 원. 실제 운영비가 아닙니다."
          example: 3000000
          maximum: 1000000000000
          minimum: 0
    Error:
      type: object
      properties:
        code:
          type: string
          example: UPSTREAM_UNAVAILABLE
        message:
          type: string
        timestamp:
          type: string
    AssessmentResult:
      type: object
      description: "미평가 항목은 점수가 null입니다. earnedScore/availablePoints로 부분 결과를 표시하고\
        , totalScore는 전체 100점이 평가될 때만 제공합니다."
      properties:
        ruleVersion:
          type: string
          example: 2026-11-20-v2
        status:
          type: string
          example: PARTIAL
        totalScore:
          type:
          - number
          - "null"
          format: double
          description: 전체 평가 전에는 null
        earnedScore:
          type: number
          format: double
          example: 31.49
        availablePoints:
          type: integer
          format: int32
          example: 56
        maxScore:
          type: integer
          format: int32
          example: 100
        coveragePercent:
          type: number
          format: double
          description: 전체 100점 중 평가 가능한 배점 비율
          example: 56
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        indicators:
          type: object
          additionalProperties:
            type: number
            format: double
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleSuggestion"
        notes:
          type: array
          items:
            type: string
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        score:
          type: number
          format: double
        availablePoints:
          type: integer
          format: int32
        maxScore:
          type: integer
          format: int32
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/Criterion"
    Criterion:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        score:
          type: number
          format: double
        maxScore:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - SCORED
          - MISSING_ANSWER
          - MISSING_DATA
          - UNSUPPORTED_DATA
          - PENDING_RULE
        reason:
          type: string
        formula:
          type: string
        evidence:
          type: object
          additionalProperties:
            type: number
            format: double
    ScheduleSuggestion:
      type: object
      properties:
        currentTime:
          type: string
          enum:
          - MORNING
          - LUNCH
          - AFTERNOON
          - DINNER
          - LATE_NIGHT
          - UNDECIDED
        suggestedTime:
          type: string
          enum:
          - MORNING
          - LUNCH
          - AFTERNOON
          - DINNER
          - LATE_NIGHT
          - UNDECIDED
        currentTimeScore:
          type: number
          format: double
        suggestedTimeScore:
          type: number
          format: double
    Source:
      type: object
      properties:
        dataset:
          type: string
        sourceUrl:
          type: string
        collectedAt:
          type: string
        matchingRecords:
          type: integer
          format: int64
    JsonNode: {}
    Page:
      type: object
      properties:
        dataset:
          type: string
          example: seoul_estimated_sales
        page:
          type: integer
          format: int32
          example: 1
        size:
          type: integer
          format: int32
          example: 100
        total:
          type: integer
          format: int64
          example: 2000
        hasNext:
          type: boolean
        source:
          type: string
          description: upstream 또는 sqlite
          example: sqlite
        fetchedAt:
          type: string
          format: date-time
          example: 2026-10-31T07:00:00Z
        items:
          type: array
          description: 데이터셋별 원본 JSON 객체. 필드 사전은 datasets를 참고하세요.
          example:
          - STDR_YYQU_CD: "20262"
            TRDAR_CD: "3130167"
            SVC_INDUTY_CD: CS300011
            THSMON_SELNG_AMT: 796270824
          items:
